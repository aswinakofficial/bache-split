name: Build and deploy Python app to Azure Web App - bachesplit

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and start virtual environment
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          cd backend
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run collectstatic
        run: |
          cd backend
          source venv/bin/activate
          python manage.py collectstatic --noinput
        env:
          SECRET_KEY: "build-secret-key-not-for-production"
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
          DB_NAME: "dummy"
          DB_USER: "dummy"
          DB_PASSWORD: "dummy"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          GOOGLE_OAUTH2_CLIENT_ID: "dummy-client-id"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !backend/venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Prepare deployment package
        run: |
          echo "Contents before cleanup:"
          ls -la
          # Create a clean deployment structure if needed
          if [ -f "output.tar.gz" ]; then
            echo "Found output.tar.gz, extracting..."
            tar -xzf output.tar.gz
            rm output.tar.gz
            echo "Contents after extraction:"
            ls -la
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3F5887971B5249B3A60125E72221ED53 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9A4D1F59A8494FB0A5A6615AF0727191 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_54EA26ABEE6042FC871E54AFADDABA54 }}

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "bachesplit"
          slot-name: "Production"